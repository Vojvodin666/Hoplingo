<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoplingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="start-screen" class="overlay">
    <h1>Hoplingo</h1>
    <p>Vyber si zvířátko a chytej cihličky se správnými slovy!</p>
    <p class="hint">Mezerník = skok (ve vzduchu ještě jednou mezerník = druhý skok)</p>
    <div id="character-select">
      <button class="char-btn" data-filter="none" aria-label="Jednorožec – klasický"><span class="char-face" style="filter: none">🦄</span></button>
      <button class="char-btn" data-filter="hue-rotate(120deg) saturate(1.6)" aria-label="Jednorožec – růžový"><span class="char-face" style="filter: hue-rotate(120deg) saturate(1.6)">🦄</span></button>
      <button class="char-btn" data-filter="hue-rotate(250deg) saturate(1.6)" aria-label="Jednorožec – modrý"><span class="char-face" style="filter: hue-rotate(250deg) saturate(1.6)">🦄</span></button>
    </div>
  </div>

  <div id="sentence-preview" class="overlay hidden">
    <h2>Zapamatuj si větu:</h2>
    <div id="preview-text"></div>
    <button id="start-btn" class="primary-btn">Start</button>
  </div>

  <div id="result-screen" class="overlay hidden">
    <h2>Výsledek</h2>
    <div id="result-errors"></div>
    <button id="new-game-btn" class="primary-btn">Nová hra</button>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <div id="rotate-hint">
    <div id="rotate-icon">📱</div>
    <p>Otoč telefon na šířku</p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
