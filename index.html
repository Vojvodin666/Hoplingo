<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoplingo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="start-screen" class="overlay">
    <h1>Hoplingo</h1>
    <p>Vyber si zvířátko a chytej cihličky se správnými slovy!</p>
    <p class="hint">Mezerník = skok (ve vzduchu ještě jednou mezerník = druhý skok)</p>
    <div id="character-select">
      <button class="char-btn" data-palette="0" aria-label="Kůň Polárka – fialová">
        <span class="char-face" style="filter: grayscale(1) sepia(1) hue-rotate(210deg) saturate(3) brightness(1.05)">🦄</span>
        <span class="char-name">Polárka</span>
      </button>
      <button class="char-btn" data-palette="1" aria-label="Kůň Uhlík – oranžová jako oheň">
        <span class="char-face" style="filter: grayscale(1) sepia(1) hue-rotate(-15deg) saturate(4) brightness(1.05)">🦄</span>
        <span class="char-name">Uhlík</span>
      </button>
    </div>
  </div>

  <div id="sentence-preview" class="overlay hidden">
    <h2>Zapamatuj si větu:</h2>
    <div id="preview-text"></div>
    <button id="start-btn" class="primary-btn">Start</button>
  </div>

  <div id="result-screen" class="overlay hidden">
    <h2>Výsledek</h2>
    <div id="result-errors"></div>
    <button id="new-game-btn" class="primary-btn">Nová hra</button>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <div id="rotate-hint">
    <div id="rotate-icon">📱</div>
    <p>Otoč telefon na šířku</p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
